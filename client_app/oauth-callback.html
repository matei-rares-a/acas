<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth PKCE - Callback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <!-- Result Section -->
        <div class="register-form-section">
            <div class="container">
                <div class="header">
                    <h1>OAuth PKCE Callback</h1>
                    <p>Authorization code received</p>
                </div>

                <div class="content">
                    <div id="alert"></div>

                    <div id="callback-status" class="status-box">
                        <h3>Callback Processing:</h3>
                        <div id="callback-status-content"></div>
                    </div>

                    <div id="auth-success" class="auth-success" style="display: none;">
                        <h2>Authentication Successful!</h2>
                        <p>You have been authenticated via OAuth 2.0 Authorization Code + PKCE.</p>
                        <div class="token-display" id="token-display"></div>
                        <button class="btn btn-primary" onclick="window.location.href='oauth-login.html'">
                            Login Again
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Network Monitor Section -->
        <div class="network-monitor-section">
            <div class="network-monitor">
                <div class="monitor-header">
                    <h2>Network Monitor</h2>
                    <button class="monitor-btn" onclick="clearNetworkMonitor()">Clear</button>
                </div>
                <div class="monitor-content" id="network-log">
                    <div class="log-item log-info">Monitor ready. Token exchange will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/network-monitor.js"></script>
    <script>
    const PKCE_CLIENT_ID = 'acas-pkce-client';

    function addCallbackStatus(message) {
        const el = document.getElementById('callback-status-content');
        if (el) {
            el.innerHTML += `<div class="status-item">${message}</div>`;
            el.scrollTop = el.scrollHeight;
        }
    }

    async function handleCallback() {
        const params = new URLSearchParams(window.location.search);
        const code   = params.get('code');
        const state  = params.get('state');
        const error  = params.get('error');

        // Error from authorization server
        if (error) {
            const desc = params.get('error_description') || error;
            showAlert(`Authorization error: ${desc}`, 'error');
            addCallbackStatus(`Authorization server returned error: ${desc}`);
            return;
        }

        if (!code) {
            addCallbackStatus('No authorization code in URL. Waiting for redirect...');
            return;
        }

        addCallbackStatus(`Received authorization code: ${code.substring(0, 12)}...`);
        addCallbackStatus(`State: ${state || '(none)'}`);

        // Retrieve PKCE session data stored before the redirect
        const savedState        = sessionStorage.getItem('oauth_state');
        const codeVerifier      = sessionStorage.getItem('oauth_code_verifier');
        const serverUrl         = sessionStorage.getItem('oauth_server_url') || 'http://localhost:5000';
        const redirectUri       = window.location.origin + window.location.pathname;

        // Validate state
        if (savedState && savedState !== state) {
            showAlert('State mismatch — possible CSRF attack. Aborting.', 'error');
            addCallbackStatus('CSRF check FAILED: state does not match.');
            return;
        }
        addCallbackStatus('State validated (CSRF check passed).');

        if (!codeVerifier) {
            showAlert('No code_verifier found in session. Cannot complete token exchange.', 'error');
            addCallbackStatus('Missing code_verifier in sessionStorage.');
            return;
        }

        // Clean up session storage
        sessionStorage.removeItem('oauth_state');
        sessionStorage.removeItem('oauth_code_verifier');
        sessionStorage.removeItem('oauth_server_url');

        // Exchange code for token
        addCallbackStatus('Exchanging code for access token (POST /oauth/pkce/token)...');

        try {
            const tokenResp = await fetch(`${serverUrl}/oauth/pkce/token`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    'Accept':       'application/json',
                },
                body: JSON.stringify({
                    grant_type:    'authorization_code',
                    code,
                    client_id:     PKCE_CLIENT_ID,
                    redirect_uri:  redirectUri,
                    code_verifier: codeVerifier,
                }),
                mode: 'cors',
            });

            const result = await tokenResp.json();

            if (!tokenResp.ok) {
                throw new Error(result.error_description || result.error || 'Token exchange failed');
            }

            addCallbackStatus('Token exchange successful!');

            document.getElementById('auth-success').style.display = 'block';
            document.getElementById('token-display').textContent   = result.access_token;
            showAlert('Authentication successful!', 'success');
        } catch (err) {
            showAlert(`Token exchange error: ${err.message}`, 'error');
            addCallbackStatus(`Error: ${err.message}`);
        }
    }

    handleCallback();
    </script>
</body>
</html>
