<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth PKCE - Callback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <!-- Result Section -->
        <div class="register-form-section">
            <div class="container">
                <div class="header">
                    <h1>OAuth PKCE Callback</h1>
                    <p>Authorization code received</p>
                </div>

                <div class="content">
                    <div id="alert"></div>

                    <!--
                    <div id="callback-status" class="status-box">
                        <h3>Callback Processing:</h3>
                        <div id="callback-status-content"></div>
                    </div>
                    -->

                    <div id="auth-success" class="auth-success" style="display: none;">
                        <h2>Authentication Successful!</h2>
                        <p>You have been authenticated via OAuth 2.0 Authorization Code + PKCE.</p>
                        <div class="token-display" id="token-display"></div>
                        <a href="oauth-login.html" class="btn btn-primary">Login Again</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Network Monitor Section -->
        <div class="network-monitor-section">
            <div class="network-monitor">
                <div class="monitor-header">
                    <h2>Network Monitor</h2>
                    <button class="monitor-btn" id="clear-monitor-btn">Clear</button>
                </div>
                <div class="monitor-content" id="network-log">
                    <div class="log-item log-info">Monitor ready. Token exchange will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sha3.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/network-monitor.js"></script>
    <script src="js/oauth-callback.js"></script>
</body>
</html>
