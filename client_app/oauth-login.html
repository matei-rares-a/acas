<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth PKCE - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <!-- Form Section -->
        <div class="register-form-section">
            <div class="container">
                <div class="header">
                    <h1>OAuth PKCE Login</h1>
                    <p>Authorization Code Flow + PKCE (RFC 7636)</p>
                </div>

                <div class="content">
                    <div id="alert"></div>

                    <div id="login-form">
                        <div class="form-group">
                            <label for="server-url">Authorization Server URL</label>
                            <input type="text" id="server-url" placeholder="http://localhost:5000" value="http://localhost:5000">
                        </div>

                        <div class="form-group">
                            <label for="redirect-uri">Redirect URI</label>
                            <input type="text" id="redirect-uri"
                                placeholder="http://localhost:5000/oauth-callback.html"
                                value="http://localhost:5000/oauth-callback.html">
                            <small style="color:#888;font-size:11px;margin-top:4px;display:block;">
                                Served directly by the auth server on port 5000.
                            </small>
                        </div>

                        <button class="btn btn-primary" id="login-btn">
                            Login with OAuth PKCE
                        </button>

                        <div class="links">
                            <a href="oauth-register.html">Don't have an account? Register here</a>
                        </div>
                    </div>

                    <!--
                    <div id="auth-status" class="status-box" style="display: none;">
                        <h3>PKCE Flow Progress:</h3>
                        <div id="auth-status-content"></div>
                    </div>
                    -->
                </div>
            </div>
        </div>

        <!-- Network Monitor Section -->
        <div class="network-monitor-section">
            <div class="network-monitor">
                <div class="monitor-header">
                    <h2>Network Monitor</h2>
                    <button class="monitor-btn" id="clear-monitor-btn">Clear</button>
                </div>
                <div class="monitor-content" id="network-log">
                    <div class="log-item log-info">Monitor ready. Requests/responses will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sha3.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/network-monitor.js"></script>
    <script src="js/oauth-pkce.js"></script>
</body>
</html>
