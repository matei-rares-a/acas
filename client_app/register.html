<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schnorr Auth - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <!-- Form Section -->
        <div class="register-form-section">
            <div class="container">
                <div class="header">
                    <h1>Register App</h1>
                    <p>Create your Schnorr account</p>
                </div>

                <div class="content">
                    <div id="alert"></div>

                    <div class="form-group">
                        <label for="username">Client_id</label>
                        <input type="text" id="username" placeholder="Enter your client ID">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password">
                    </div>

                    <div class="form-group">
                        <label for="server-url">Server URL</label>
                        <input type="text" id="server-url" placeholder="http://localhost:5000" value="http://localhost:5000">
                    </div>

                    <button class="btn btn-primary" id="register-btn" onclick="register()">
                        Register
                    </button>

                    <div class="links">
                        <a href="login.html">Already have an account? Login here</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Network Monitor Section -->
        <div class="network-monitor-section">
            <div class="network-monitor">
                <div class="monitor-header">
                    <h2>Network Monitor</h2>
                    <button class="monitor-btn" id="clear-monitor-btn" onclick="clearNetworkMonitor()">Clear</button>
                </div>
                <div class="monitor-content" id="network-log">
                    <div class="log-item log-info">Monitor ready. Requests/responses will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/network-monitor.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
